name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # L'API visée n'est ni documentée ni stable, et les exigences de HACS et de
    # hassfest évoluent. Un passage hebdomadaire signale la casse avant qu'un
    # utilisateur ne la découvre.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Le dépôt est destiné à une installation en dépôt personnalisé, pas
          # au catalogue HACS par défaut : les contrôles propres au catalogue
          # (marque déclarée dans home-assistant/brands, topics du dépôt) ne
          # s'appliquent pas et échoueraient à tort.
          ignore: brands topics

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
