name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The targeted API is neither documented nor stable, and HACS's and
    # hassfest's requirements evolve. A weekly run flags breakage before a
    # user discovers it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # This repository is meant for a custom-repository install, not
          # the default HACS catalog: catalog-specific checks (brand
          # declared in home-assistant/brands, repository topics) don't
          # apply and would fail incorrectly.
          ignore: brands topics

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
